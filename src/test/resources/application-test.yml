spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///havita_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: a-very-long-and-secure-test-secret-key-that-is-at-least-256-bits-long

  email:
    brevo:
      api-key: dummy-test-key
